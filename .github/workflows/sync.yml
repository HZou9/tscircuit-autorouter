name: sync-upstream

# Daily merge of tscircuit/tscircuit-autorouter into this fork.
# Uses a real git merge (not `gh repo sync`) so this workflow file and any
# local experiments survive the sync instead of being force-overwritten.

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/tscircuit/tscircuit-autorouter.git

      - name: Fetch upstream
        run: git fetch upstream --tags --prune

      - name: Merge upstream into this branch
        run: |
          set -euo pipefail
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          UP="$(git remote show upstream | sed -n 's/.*HEAD branch: //p')"
          echo "fork branch = $BRANCH ; upstream default = $UP"
          BEFORE="$(git rev-parse HEAD)"
          git merge "upstream/$UP" --no-edit
          AFTER="$(git rev-parse HEAD)"
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "already up to date — nothing to push"
          else
            echo "--- new commits ---"
            git log --oneline "$BEFORE..$AFTER" | head -40
            git push origin "$BRANCH"
          fi
          git push origin --tags || true

      - name: Summary
        if: always()
        run: |
          echo "### sync-upstream: tscircuit/tscircuit-autorouter" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "HEAD: $(git rev-parse --short HEAD) — $(git log -1 --format=%s)" >> $GITHUB_STEP_SUMMARY
